<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
<!-- ===== BASIC SEO ===== -->
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===== Dynamic Title ===== -->
<title>
{% if page.title %}
{{ page.title }} | قرطاسیه فروشی و مطبعه علی اکبری در کابل
{% else %}
قرطاسیه فروشی و مطبعه علی اکبری در کابل
{% endif %}
</title>

<!-- ===== Dynamic Description ===== -->
<meta name="description" content="
{% if page.description %}
{{ page.description }}
{% else %}
چاپ، کپی، اسکن، PVC کارت، عکاسی و آموزش کامپیوتر در کابل با قیمت مناسب
{% endif %}
">

<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="googlebot" content="index, follow">

<!-- ===== Canonical Dynamic ===== -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- ===== Open Graph Dynamic ===== -->
<meta property="og:title" content="{{ page.title | default: 'قرطاسیه فروشی و مطبعه علی اکبری در کابل' }}">
<meta property="og:description" content="{{ page.description | default: 'چاپ، کپی، اسکن و خدمات دیجیتال در کابل' }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.url }}/og-image.jpg">
<meta property="og:locale" content="fa_AF">

<!-- ===== Twitter ===== -->
<meta name="twitter:card" content="summary_large_image">

<!-- ===== Favicon ===== -->
<link rel="icon" type="image/png" href="{{ site.url }}/favicon.png">
<link rel="apple-touch-icon" href="{{ site.url }}/favicon.png">

<!-- ===== Structured Data Local Business ===== -->
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": ["StationeryStore","LocalBusiness"],
 "name": "قرطاسیه فروشی و مطبعه علی اکبری در کابل",
 "url": "{{ site.url }}",
 "image": "{{ site.url }}/og-image.jpg",
 "telephone": "+93781821838",
 "address": {
   "@type": "PostalAddress",
   "streetAddress": "شهرک ۱۲ امام",
   "addressLocality": "کابل",
   "addressCountry": "AF"
 },
 "areaServed": "Kabul"
}
</script>

<!-- ===== Dynamic Schema for Services ===== -->
{% if page.schema == "service" %}
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "Service",
 "name": "{{ page.title }}",
 "provider": {
   "@type": "LocalBusiness",
   "name": "قرطاسیه فروشی و مطبعه علی اکبری در کابل"
 },
 "areaServed": "Kabul"
}
</script>
{% endif %}

<!-- ===== Google Analytics ===== -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VYGZ3635RG"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-VYGZ3635RG');
</script>

</head>
<body>
    {% include header.html %}
    
    {{ content }}
    
    {% include footer.html %}
    
    <!-- JavaScript Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
    
    <!-- Main JavaScript -->
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    
    {% if page.scripts %}
    <script>
        {{ page.scripts }}
    </script>
    {% endif %}
</body>
</html>
