<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
    <script>
    if (window.location.href.startsWith('https://www.ali-akbari-af.github.io')) {
        window.location.href = 'https://ali-akbari-af.github.io' + window.location.pathname;
    }
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: 'قرطاسیه فروشی و مطبعه علی اکبری' }}</title>
    <meta name="description" content="{{ page.description | default: 'خدمات چاپ، کتاب‌فروشی، لوازم تحریر و آموزش دیجیتال در کابل. کیفیت بالا، قیمت منصفانه.' }}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="googlebot" content="index, follow">

    <link rel="canonical" href="{{ site.url }}{{ page.url }}">

    <meta property="og:title" content="{{ page.title | default: 'قرطاسیه علی اکبری کابل' }}">
    <meta property="og:description" content="{{ page.description | default: 'خدمات چاپ، کتاب‌فروشی، لوازم تحریر و آموزش دیجیتال در کابل.' }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/og-image.jpg">
    <meta property="og:locale" content="fa_AF">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/png" href="{{ site.url }}/favicon.png">
    <link rel="apple-touch-icon" href="{{ site.url }}/favicon.png">

    <link rel="preload" href="{{ site.url }}/favicon.png" as="image">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": ["StationeryStore","LocalBusiness","PrintShop"],
    "name": "قرطاسیه فروشی و مطبعه علی اکبری",
    "description": "خدمات چاپ، کتاب‌فروشی، لوازم تحریر و آموزش دیجیتال در کابل. کیفیت بالا، قیمت منصفانه، تحویل سریع.",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/og-image.jpg",
    "telephone": "+93781821838",
    "email": "tarjman.online@gmail.com",
    "address": {
        "@type": "PostalAddress",
        "streetAddress": "شهرک ۱۲ امام، ناحیه ۶",
        "addressLocality": "کابل",
        "addressCountry": "AF"
    },
    "geo": {
        "@type": "GeoCoordinates",
        "latitude": 34.5553,
        "longitude": 69.2075
    },
    "areaServed": {
        "@type": "City",
        "name": "Kabul"
    },
    "priceRange": "$$",
    "openingHoursSpecification": [
        {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday"],
            "opens": "07:00",
            "closes": "19:00"
        }
    ],
    "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "خدمات چاپ و قرطاسیه",
        "itemListElement": [
            {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "پرینت و کپی"}},
            {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "چاپ کارت عروسی"}},
            {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "کتاب‌فروشی"}},
            {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "لوازم تحریر"}},
            {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "عکاسی و ادیت"}},
            {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "آموزش کامپیوتر"}}
        ]
    },
    "sameAs": [
        "https://www.facebook.com/khdmat.kampywtry.ly.akbry/"
    ]
    }
    </script>

    {% if page.schema == "service" %}
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
     "@type": "{{ page.service_type | default: 'Service' }}",
    "name": "{{ page.title }}",
    "description": "{{ page.description }}",
    "provider": {
        "@type": "LocalBusiness",
        "name": "قرطاسیه فروشی و مطبعه علی اکبری",
        "telephone": "+93781821838",
        "address": {
            "@type": "PostalAddress",
            "addressLocality": "کابل"
        }
    },
    "areaServed": {
        "@type": "City",
        "name": "Kabul"
    }
    }
    </script>
    {% endif %}

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VYGZ3635RG"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VYGZ3635RG');
    </script>

    {% include head.html %}

    {% if page.style %}
    <style>
        {{ page.style }}
    </style>
    {% endif %}
</head>
<body>
    {% include header.html %}

    <main id="main-content">
    {{ content }}
    </main>

    {% include footer.html %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js" defer></script>
    <script src="{{ '/assets/js/main.min.js' | relative_url }}" defer></script>

    {% if page.scripts %}
    <script>
        {{ page.scripts }}
    </script>
    {% endif %}
</body>
</html>
