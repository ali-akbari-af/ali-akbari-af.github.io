<!-- ===== BASIC SEO ===== -->
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Meta Tags -->
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="keywords" content="{{ page.keywords | default: site.keywords }}">

<!-- SEO -->
<meta name="robots" content="index, follow">
<meta name="googlebot" content="index, follow">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Lightbox CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">

<!-- Main CSS -->
<link rel="stylesheet" href="{{ '/assets/css/header-footer.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <!-- ===== BASIC SEO ===== -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="googlebot" content="index, follow">
    <!-- google varification -->
    <meta name="google-site-verification" content="QHBhurzsqnaQRHCE2yLsT2tmIS8DgY-pQy3mgZEW4S4" />

    <!-- ===== Canonical Dynamic ===== -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- ===== Open Graph Dynamic ===== -->
    <meta property="og:title" content="{{ page.title | default: 'قرطاسیه فروشی و مطبعه علی اکبری در کابل' }}">
    <meta property="og:description" content="{{ page.description | default: 'چاپ، کپی، اسکن و خدمات دیجیتال در کابل' }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.url }}/og-image.jpg">
    <meta property="og:locale" content="fa_AF">

    <!-- ===== Twitter ===== -->
    <meta name="twitter:card" content="summary_large_image">

    <!-- ===== Favicon ===== -->
    <link rel="icon" type="image/png" href="{{ site.url }}/favicon.png">
    <link rel="apple-touch-icon" href="{{ site.url }}/favicon.png">

    <!-- ===== Structured Data Local Business ===== -->
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": ["StationeryStore","LocalBusiness"],
    "name": "قرطاسیه فروشی و مطبعه علی اکبری در کابل",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/og-image.jpg",
    "telephone": "+93781821838",
    "address": {
    "@type": "PostalAddress",
    "streetAddress": "شهرک ۱۲ امام",
    "addressLocality": "کابل",
    "addressCountry": "AF"
    },
    "areaServed": "Kabul"
    }
    </script>

    <!-- ===== Dynamic Schema for Services ===== -->
    {% if page.schema == "service" %}
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "Service",
    "name": "{{ page.title }}",
    "provider": {
    "@type": "LocalBusiness",
    "name": "قرطاسیه فروشی و مطبعه علی اکبری در کابل"
    },
    "areaServed": "Kabul"
    }
    </script>
    {% endif %}

    <!-- ===== Google Analytics ===== -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VYGZ3635RG"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VYGZ3635RG');
    </script>
